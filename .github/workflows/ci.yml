name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle
      - name: The npm package still ships only dist, README, LICENSE and package.json
        run: |
          npm run build
          npm pack --dry-run --json | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path);
            const bad = files.filter((p) => !/^(dist\/|README\.md$|LICENSE$|package\.json$)/.test(p));
            if (bad.length || !files.includes("dist/main.js")) { console.error("unexpected package contents:", bad); process.exit(1); }'
      - run: sh -n install.sh

  sea-smoke:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run bundle
      - run: npm run build:sea
      - run: node scripts/smoke-sea.mjs "build/memtro-${{ matrix.target }}" "$(node -p 'require("./package.json").version')"
